# BEGIN_KITTY_THEME
# Catppuccin-Frappe
include current-theme.conf
# END_KITTY_THEME

# font_family GohuFont 14 Nerd Font
# font_family GohuFont 11 Nerd Font
# font_family family='FiraCode Nerd Font' style=SemiBold
font_family family='FiraCode Nerd Font'
font_size 10
disable_ligatures_in cursor

hide_window_decorations yes
enable_audio_bell no

# Force a distinct sequence for Shift+Enter so it survives tmux's
# modifyOtherKeys bridge (Enter alone isn't disambiguated by default).
# Lets Claude Code in tmux insert newlines with Shift+Enter.
map shift+enter send_text all \x1b[13;2u
